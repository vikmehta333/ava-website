    - generic [ref=f1e26]: AI Use Case · Sales
    - heading "Set up cold email so it lands in the inbox, not spam" [level=1] [ref=f1e27]
    - paragraph [ref=f1e28]: Dedicated sending domains, authentication records and a warm-up schedule — the infrastructure that decides whether anyone ever sees your outreach.
    - generic [ref=f1e29]:
      - generic [ref=f1e30]:
        - heading "How it works" [level=3] [ref=f1e31]
        - list [ref=f1e32]:
          - listitem [ref=f1e33]: Buy sending domains separate from your main one, so a deliverability problem can never hurt your real company email.
          - listitem [ref=f1e34]: Set SPF, DKIM and DMARC records on each sending domain, then verify each one passes before a single campaign email goes out.
          - listitem [ref=f1e35]: Warm each inbox for 2–3 weeks with gradually increasing volume before real sending begins.
          - listitem [ref=f1e36]: Cap each inbox at 30–50 emails a day and add inboxes to scale volume, rather than pushing one inbox harder.
          - listitem [ref=f1e37]: Watch bounce and spam-complaint rates weekly; pause and repair a domain the moment either climbs.
      - generic [ref=f1e38]:
        - heading "The guardrail" [level=3] [ref=f1e39]
        - generic [ref=f1e40]: Never send from your primary company domain, and never skip the warm-up to launch faster — a burned domain takes months to recover and can affect your real email.
        - paragraph [ref=f1e41]: "Tools that do this: Dedicated sending domains · Google Workspace or Microsoft 365 inboxes · Instantly.ai or Lemlist (sequencing + warm-up) · your DNS host for SPF/DKIM/DMARC"
    - generic [ref=f1e42]:
      - generic [ref=f1e43]:
        - generic [ref=f1e44]: Prompt to start with
        - button "Copy prompt" [ref=f1e45] [cursor=pointer]
      - generic [ref=f1e46]: "You are helping [business name] prepare cold email infrastructure. Current setup: [list sending domains, inbox provider, and any existing DNS records]. 1. Tell me which of SPF, DKIM and DMARC are missing or misconfigured, and give the exact DNS record to add for each. 2. Propose a 3-week warm-up ramp: emails per inbox per day, week by week. 3. Given a target of [N] emails per day, tell me how many inboxes and domains I need at a 30–50/day/inbox cap. 4. List the deliverability metrics to check weekly and the threshold at which I should pause sending. Do not recommend sending from the primary company domain. Do not suggest shortcuts that skip warm-up."
